name: Bug Report
description: Report a reproducible problem with Atomic Drift Tuner (ADT).
title: "[BUG] "

body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping test Atomic Drift Tuner (ADT).

        Use this form when something in ADT is broken, crashes, behaves incorrectly, loses data, or otherwise does not work as expected.

        If ADT works technically but you are evaluating whether a tuning, FFB, AZOM, Desired Behavior, or telemetry recommendation made the car better or worse, please use the **Beta Test Report** instead.

        Please include enough detail for the issue to be reproduced.

        Do not post passwords, tokens, credentials, private paths, proprietary third-party files, or personal telemetry you do not want made public.

  - type: input
    id: adt_version
    attributes:
      label: ADT version
      description: The version where you experienced the problem.
      placeholder: v0.8.1-beta.1
    validations:
      required: true

  - type: dropdown
    id: build_type
    attributes:
      label: Build type
      options:
        - Installer
        - Portable
        - Source / development build
        - Unsure
    validations:
      required: true

  - type: input
    id: bridge_version
    attributes:
      label: ADT SimHub Bridge version
      description: Found in System Diagnostics. Enter N/A if the issue does not involve SimHub/AZOM.
      placeholder: v0.7.2 or N/A
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area of the application
      options:
        - Main tuning / generated tune
        - Full AZOM Settings
        - Live AZOM readback / Apply / Revert
        - AC Car Scanner
        - Active car / drift-pack detection
        - AC Car Setup Tuner
        - Desired Behavior / behavior blending
        - Telemetry Recorder
        - Tuning Assistant
        - ADT Remote
        - Profiles / configuration persistence
        - Appearance / UI readability
        - Setup & Paths
        - System Diagnostics / support package
        - Installer / portable package
        - SimHub Bridge
        - Update / upgrade process
        - Other
    validations:
      required: true

  - type: dropdown
    id: severity
    attributes:
      label: Severity
      options:
        - Cosmetic / readability only
        - Minor - workaround exists
        - Major - feature cannot be used
        - Crash / freeze
        - Data loss / corrupted settings
        - Safety concern involving wheelbase behavior
    validations:
      required: true

  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: Windows 11 24H2
    validations:
      required: true

  - type: input
    id: wheelbase
    attributes:
      label: Wheelbase
      description: Enter N/A if not relevant.
      placeholder: MOZA R12
    validations:
      required: true

  - type: input
    id: wheel
    attributes:
      label: Steering wheel / rim
      description: Enter N/A if not relevant.
      placeholder: MOZA CS Pro
    validations:
      required: true

  - type: input
    id: firmware
    attributes:
      label: Wheelbase firmware
      description: Enter N/A or Unknown if not relevant or not known.
      placeholder: Firmware version or N/A

  - type: input
    id: drift_pack
    attributes:
      label: Drift pack
      description: Enter N/A if not relevant.
      placeholder: Team SWARM V3.2
    validations:
      required: true

  - type: input
    id: car
    attributes:
      label: Car
      description: Exact car/folder name when possible. Enter N/A if not relevant.
      placeholder: Exact car name / folder
    validations:
      required: true

  - type: input
    id: track
    attributes:
      label: Track
      description: Enter N/A if the problem is not related to an AC session.
      placeholder: Track name or N/A

  - type: input
    id: simhub_version
    attributes:
      label: SimHub version
      description: Enter N/A if the issue does not involve SimHub.
      placeholder: SimHub version or N/A
    validations:
      required: true

  - type: input
    id: azom_version
    attributes:
      label: AZOM version
      description: Enter N/A if the issue does not involve AZOM.
      placeholder: AZOM version or N/A
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
      placeholder: Describe the expected result.
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: What actually happened?
      placeholder: Include exact error messages, incorrect values, visual problems, lost data, or unexpected behavior.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Please make the steps as exact as possible.
      placeholder: |
        1. Open ADT...
        2. Select...
        3. Click...
        4. Observe...
    validations:
      required: true

  - type: dropdown
    id: reproducibility
    attributes:
      label: How often can you reproduce the problem?
      options:
        - Every time
        - Most of the time
        - Sometimes
        - Only happened once
        - Unable to test again
    validations:
      required: true

  - type: textarea
    id: workaround
    attributes:
      label: Workaround
      description: If you found a way to avoid or temporarily fix the problem, describe it here.

  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics / logs / support ZIP
      description: |
        If relevant, attach the privacy-redacted support ZIP from System Diagnostics by dragging it into this field.

        Before uploading, you are welcome to review the support bundle contents.

        Do not attach proprietary SimHub/AZOM/MOZA DLLs, credentials, or unrelated private files.

  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Add screenshots, video, error messages, or anything else that may help investigate the problem.

  - type: checkboxes
    id: checklist
    attributes:
      label: Tester checklist
      options:
        - label: I reproduced or observed this problem on the ADT version listed above.
          required: true
        - label: I checked that I am not posting a password, token, credential, secret, or private file.
          required: true
        - label: If this involves unsafe wheelbase behavior, I stopped testing the problematic settings.
          required: true
        - label: If this involves a live AZOM write, I checked the requested and live/readback values where possible.
          required: false
