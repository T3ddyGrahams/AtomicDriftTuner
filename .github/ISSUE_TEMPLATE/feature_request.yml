name: Feature Request
description: Suggest a new feature or improvement for Atomic Drift Tuner (ADT).
title: "[FEATURE] "

body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting an improvement to Atomic Drift Tuner (ADT).

        Please describe the problem or use case first. That makes it easier to determine whether the best solution belongs in the UI, tuning engine, telemetry system, AC setup layer, hardware integration, or another part of ADT.

        Before submitting, please check the existing issues and ADT Development Roadmap for similar ideas.

        Roadmap:
        https://github.com/T3ddyGrahams/AtomicDriftTuner/blob/main/ROADMAP.md

  - type: dropdown
    id: area
    attributes:
      label: Feature area
      options:
        - Tuning engine
        - Wheelbase / wheel support
        - FFB / AZOM
        - SimHub Bridge / integration
        - Assetto Corsa car scanner
        - Active car / drift-pack detection
        - AC Car Setup Tuner
        - Desired Behavior
        - Telemetry Recorder / analysis
        - Tuning Assistant
        - ADT Remote
        - Control Center / touchscreen
        - Appearance / accessibility
        - Diagnostics / support tools
        - Profiles / tune history / data
        - Tune sharing / community
        - Installer / distribution
        - Updates / release system
        - Discord / community integration
        - Documentation
        - Other
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe the current limitation, repetitive task, missing capability, or workflow problem.
      placeholder: What are you trying to do that ADT does not currently handle well?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: What would you like ADT to do?
      description: Describe the behavior, feature, or improvement you would like to see.
      placeholder: Describe the proposed behavior or UI.
    validations:
      required: true

  - type: textarea
    id: example
    attributes:
      label: Example workflow
      description: Show how you imagine using the feature.
      placeholder: |
        1. I select...
        2. ADT detects...
        3. ADT recommends/shows...
        4. I review...
        5. I apply/save/compare...

  - type: textarea
    id: benefit
    attributes:
      label: What would make this feature successful?
      description: Describe the result you would expect if this feature worked well.
      placeholder: |
        For example:
        - saves repeated setup work
        - makes a recommendation easier to understand
        - supports additional hardware
        - improves tuning accuracy
        - reduces steps during a drift session

  - type: textarea
    id: hardware
    attributes:
      label: Relevant hardware / car / pack / integration
      description: Optional. Include these if the idea depends on a particular setup, car, drift pack, SimHub/AZOM configuration, or other integration.

  - type: dropdown
    id: importance
    attributes:
      label: How important is this to your use of ADT?
      options:
        - Nice to have
        - Would improve my workflow
        - Major missing capability
        - Blocks a workflow I want to use
        - Blocks me from using/testing ADT
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Current workaround or alternative
      description: Optional. If you currently accomplish this another way, tell us how.

  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Optional. Add screenshots, mockups, examples, links, or anything else that helps explain the idea.

  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I checked existing issues for a similar request.
          required: true
        - label: I checked the ADT Development Roadmap for an existing planned feature.
          required: true
        - label: This request does not require redistributing proprietary third-party binaries without permission.
          required: true
