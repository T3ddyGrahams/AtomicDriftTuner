name: Discord Release Announcement

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  discord-release:
    runs-on: ubuntu-latest

    steps:
      - name: Send release to Discord
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_RELEASE_WEBHOOK }}
          RELEASE_NAME: ${{ github.event.release.name || 'Atomic Discord Integration Test' }}
          RELEASE_TAG: ${{ github.event.release.tag_name || 'test' }}
          RELEASE_URL: ${{ github.event.release.html_url || github.server_url }}
          RELEASE_BODY: ${{ github.event.release.body || 'GitHub Actions is successfully connected to the Atomic Drift Tuner Discord server.' }}
          IS_PRERELEASE: ${{ github.event.release.prerelease || 'true' }}
          IS_MANUAL: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          python3 <<'PY'
          import json
          import os
          import urllib.request

          webhook = os.environ["DISCORD_WEBHOOK"]
          name = os.environ.get("RELEASE_NAME") or os.environ["RELEASE_TAG"]
          tag = os.environ["RELEASE_TAG"]
          url = os.environ["RELEASE_URL"]
          body = os.environ.get("RELEASE_BODY") or "No release notes provided."
          prerelease = os.environ.get("IS_PRERELEASE", "false").lower() == "true"
          manual = os.environ.get("IS_MANUAL", "false").lower() == "true"

          # Discord embed descriptions have a size limit,
          # so trim extremely long release notes.
          if len(body) > 3500:
              body = body[:3500] + "\n\n…See GitHub for the full changelog."

          if manual:
            title = "✅ Atomic Drift Tuner — Discord Integration Test"
            status = "Connection successful"
          elif prerelease:
            title = f"🧪 Atomic Drift Tuner {tag} — Test Build"
            status = "Pre-release / testing build"
          else:
            title = f"⚛️ Atomic Drift Tuner {tag} Released!"
            status = "Stable release"

          payload = {
              "username": "Atomic Drift Tuner",
              "embeds": [
                  {
                      "title": title,
                      "url": url,
                      "description": body,
                      "fields": [
                          {
                              "name": "Build",
                              "value": name,
                              "inline": True
                          },
                          {
                              "name": "Status",
                              "value": status,
                              "inline": True
                          }
                      ],
                      "footer": {
                          "text": "Atomic Drift Tuner • GitHub Release"
                      }
                  }
              ]
          }

          data = json.dumps(payload).encode("utf-8")

          request = urllib.request.Request(
              webhook,
              data=data,
              headers={
                  "Content-Type": "application/json",
                  "User-Agent": "Atomic-Drift-Tuner-GitHub-Actions"
              },
              method="POST"
          )

          with urllib.request.urlopen(request) as response:
              print(f"Discord response: {response.status}")
          PY
