name: Publish Preview

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'New preview version, e.g. 0.9.0-preview.9 (do not reuse a published version)'
        required: true
        type: string
      hours:
        description: 'Download link lifetime in hours'
        type: choice
        default: '24'
        options: ['1', '24', '72', '168']

permissions:
  contents: read
  actions: read

concurrency:
  group: adt-publish-preview
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/signpath-build-prep.yml
    with:
      version: ${{ inputs.version }}
      publish_preview: true
      hours: ${{ fromJSON(inputs.hours) }}
    secrets:
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      PREVIEW_PUBLISH_TOKEN: ${{ secrets.PREVIEW_PUBLISH_TOKEN }}
