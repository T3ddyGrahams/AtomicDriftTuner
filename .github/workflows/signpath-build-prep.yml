name: SignPath Build Prep

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      publish_preview:
        type: boolean
        default: false
      hours:
        type: number
        default: 24
    secrets:
      R2_ACCESS_KEY_ID:
        required: false
      R2_SECRET_ACCESS_KEY:
        required: false
      PREVIEW_PUBLISH_TOKEN:
        required: false
  workflow_dispatch:
    inputs:
      version:
        description: "ADT version to build, without leading v"
        required: true
        default: "0.8.3-beta.1"

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      ADT_RELEASE_VERSION: ${{ inputs.version }}
      SIMHUB_VERSION: "9.12.4"
      SIMHUB_SHA256: "1a27063f1748177f97a9785e2155c1e27b1f5dd640dc1a2b23c4d76104612f54"
    steps:
      - name: Validate release version
        shell: pwsh
        run: |
          if ($env:ADT_RELEASE_VERSION -notmatch '^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*)?(?:\+[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*)?$') {
            throw "Invalid ADT release version."
          }
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup .NET 8
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "8.0.x"
      - name: Validate preview publishing setup
        if: ${{ inputs.publish_preview }}
        shell: pwsh
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
          R2_BUCKET_NAME: ${{ vars.R2_BUCKET_NAME }}
          PREVIEW_PUBLISH_TOKEN: ${{ secrets.PREVIEW_PUBLISH_TOKEN }}
          ADT_LINK_HOURS: ${{ inputs.hours }}
        run: ./scripts/publish-preview.ps1 -Preflight
      - name: Run preview manager tests
        if: ${{ inputs.publish_preview }}
        shell: pwsh
        run: node --experimental-default-type=module --test cloudflare/preview-downloads/worker.test.mjs cloudflare/preview-downloads/publishing.test.mjs
      - name: Test publishing failure handling offline
        if: ${{ inputs.publish_preview }}
        shell: pwsh
        run: ./tests/publish-preview.Tests.ps1
      - name: Run regression tests
        timeout-minutes: 10
        shell: pwsh
        run: dotnet run --project .\tests\AtomicDriftTuner.RegressionTests\AtomicDriftTuner.RegressionTests.csproj -c Release
      - name: Build layout tests
        timeout-minutes: 10
        shell: pwsh
        run: dotnet build .\tests\AtomicDriftTuner.LayoutTests\AtomicDriftTuner.LayoutTests.csproj -c Release --verbosity minimal
      - name: Run layout tests
        timeout-minutes: 5
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force .\artifacts\layout-checks | Out-Null
          dotnet run --project .\tests\AtomicDriftTuner.LayoutTests\AtomicDriftTuner.LayoutTests.csproj -c Release --no-build --no-restore 2>&1 | Tee-Object -FilePath .\artifacts\layout-checks\layout-tests.log
          exit $LASTEXITCODE
      - name: Upload layout diagnostics
        if: ${{ always() }}
        timeout-minutes: 3
        uses: actions/upload-artifact@v6
        with:
          name: "adt-layout-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}"
          path: artifacts/layout-checks/
          if-no-files-found: warn
          retention-days: 14
      - name: Download and verify pinned SimHub installer
        timeout-minutes: 10
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $zip = Join-Path $env:RUNNER_TEMP "SimHub.$env:SIMHUB_VERSION.zip"
          $extract = Join-Path $env:RUNNER_TEMP "SimHubInstaller"
          Invoke-WebRequest -Uri "https://github.com/SHWotever/SimHub/releases/download/$env:SIMHUB_VERSION/SimHub.$env:SIMHUB_VERSION.zip" -OutFile $zip
          $actual = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $env:SIMHUB_SHA256) { throw "SimHub archive SHA256 mismatch. Expected $env:SIMHUB_SHA256, got $actual" }
          Expand-Archive -LiteralPath $zip -DestinationPath $extract -Force
          $installer = Join-Path $extract "SimHubSetup_$env:SIMHUB_VERSION.exe"
          if (-not (Test-Path -LiteralPath $installer -PathType Leaf)) {
            Get-ChildItem -LiteralPath $extract -Recurse -File | Select-Object FullName, Length
            throw "Expected SimHub installer was not found in the verified archive: $installer"
          }
          Write-Host "Verified SimHub $env:SIMHUB_VERSION archive and located its setup executable."
      - name: Install SimHub build references on temporary runner
        timeout-minutes: 5
        env:
          SIMHUB_RUNNER_ENVIRONMENT: ${{ runner.environment }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          if ($env:GITHUB_ACTIONS -ne 'true' -or $env:SIMHUB_RUNNER_ENVIRONMENT -ne 'github-hosted') {
            throw "SimHub CI installation is restricted to GitHub-hosted runners."
          }
          $installer = Join-Path $env:RUNNER_TEMP "SimHubInstaller\SimHubSetup_$env:SIMHUB_VERSION.exe"
          $installPath = Join-Path $env:RUNNER_TEMP "SimHubBuildReferences"
          $diagnostics = Join-Path $env:GITHUB_WORKSPACE "artifacts\simhub-diagnostics"
          New-Item -ItemType Directory -Path $diagnostics -Force | Out-Null
          $log = Join-Path $diagnostics "setup.log"
          $arguments = @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-', '/NOICONS', '/TASKS=""', '/NOCLOSEAPPLICATIONS', '/NORESTARTAPPLICATIONS', "/DIR=`"$installPath`"", "/LOG=`"$log`"")
          Write-Host "Installing verified SimHub build references in $installPath"
          $process = Start-Process -FilePath $installer -ArgumentList $arguments -WindowStyle Hidden -PassThru
          try {
            if (-not $process.WaitForExit(240000)) {
              $process.Kill($true)
              throw "SimHub setup exceeded four minutes; inspect the setup log artifact."
            }
            if ($process.ExitCode -ne 0) { throw "SimHub setup failed with exit code $($process.ExitCode)." }
          } finally {
            $process.Dispose()
            if (Test-Path -LiteralPath $log) { Get-Content -LiteralPath $log -Tail 40 }
          }
          $required = @('SimHub.Plugins.dll', 'GameReaderCommon.dll', 'SimHub.Logging.dll', 'Newtonsoft.Json.dll', 'log4net.dll')
          foreach ($name in $required) {
            $reference = Join-Path $installPath $name
            if (-not (Test-Path -LiteralPath $reference -PathType Leaf)) {
              Get-ChildItem -LiteralPath $installPath -File | Select-Object Name, Length
              throw "Required SimHub build reference missing after setup: $name"
            }
            $identity = [System.Reflection.AssemblyName]::GetAssemblyName($reference)
            Write-Host "Verified build reference: $($identity.FullName)"
          }
          "SIMHUB_PATH=$installPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Upload SimHub setup diagnostics
        if: ${{ always() }}
        timeout-minutes: 3
        uses: actions/upload-artifact@v6
        with:
          name: "adt-simhub-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}"
          path: artifacts/simhub-diagnostics/
          if-no-files-found: warn
          retention-days: 14
      - name: Locate or install Inno Setup 6
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $candidates = @("${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe", "$env:ProgramFiles\Inno Setup 6\ISCC.exe")
          $iscc = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) { choco install innosetup -y --no-progress; $iscc = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1 }
          if (-not $iscc) { throw "Inno Setup 6 was not found after installation." }
          "INNO_SETUP_PATH=$iscc" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Build ADT release artifacts
        shell: pwsh
        run: |
          Set-ExecutionPolicy -Scope Process -ExecutionPolicy Bypass
          .\build-github-release.ps1 -Version "$env:ADT_RELEASE_VERSION" -SimHubPath "$env:SIMHUB_PATH" -InnoSetupPath "$env:INNO_SETUP_PATH"
      - name: Verify expected release files
        shell: pwsh
        run: |
          $version = $env:ADT_RELEASE_VERSION
          $portable = ".\artifacts\release\AtomicDriftTuner-$version-portable.zip"
          $installer = ".\artifacts\release\AtomicDriftTuner-$version-setup.exe"
          if (-not (Test-Path $portable)) { throw "Missing $portable" }
          if (-not (Test-Path $installer)) { throw "Missing $installer" }
          Get-FileHash $portable -Algorithm SHA256
          Get-FileHash $installer -Algorithm SHA256
      - name: Upload unsigned release artifact
        if: ${{ !inputs.publish_preview }}
        id: upload-unsigned
        uses: actions/upload-artifact@v6
        with:
          name: "adt-unsigned-${{ inputs.version }}"
          path: |
            artifacts/release/AtomicDriftTuner-${{ inputs.version }}-portable.zip
            artifacts/release/AtomicDriftTuner-${{ inputs.version }}-setup.exe
          if-no-files-found: error
          retention-days: 14

      - name: Publish private preview and prepare announcement
        if: ${{ inputs.publish_preview }}
        shell: pwsh
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
          R2_BUCKET_NAME: ${{ vars.R2_BUCKET_NAME }}
          PREVIEW_PUBLISH_TOKEN: ${{ secrets.PREVIEW_PUBLISH_TOKEN }}
          ADT_LINK_HOURS: ${{ inputs.hours }}
        run: ./scripts/publish-preview.ps1

      # SignPath submission is intentionally not enabled yet.
      # Add signpath/github-action-submit-signing-request@v2 after acceptance
      # and use steps.upload-unsigned.outputs.artifact-id.
